<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your SmartCNG dashboard - manage bookings, favorites, and profile.">
    <title>Dashboard – SmartCNG</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/theme-light.css' %}">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <!-- <div class="brand-icon">⛽</div> -->
            Smart<span style="color: var(--color-accent);">CNG</span>
        </a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/dashboard/" class="active">Dashboard</a></li>
            <li><a href="/bookings/">My Bookings</a></li>
        </ul>
        <div class="nav-auth"></div>
        <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">☰</button>
    </nav>

    <main class="main-content">
        <div class="container" style="padding-top: 32px;">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">
                Welcome, <span id="dashboard-username" style="color: var(--color-accent);">User</span>
            </h1>
            <p style="color: var(--color-text-secondary); margin-bottom: 32px;">Manage your CNG stations, bookings, and
                preferences.</p>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('profile')">Profile</button>
                <button class="tab" onclick="switchTab('bookings')">Bookings</button>
                <button class="tab" onclick="switchTab('favorites')"> Favorites</button>
            </div>

            <!-- Profile Tab -->
            <div class="tab-panel active" id="tab-profile">
                <div class="dashboard-grid" style="padding: 0;">
                    <div class="dashboard-card">
                        <h3>Profile Information</h3>
                        <form id="profile-form" onsubmit="handleProfileUpdate(event)">
                            <div class="form-group">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-input" id="profile-username" disabled>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" id="profile-email" disabled>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                <div class="form-group">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-input" id="profile-firstname" disabled>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-input" id="profile-lastname" disabled>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-input" id="profile-phone" disabled>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                <div class="form-group">
                                    <label class="form-label">Vehicle Number *</label>
                                    <input type="text" class="form-input" id="profile-vehicle" required disabled>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Vehicle Type</label>
                                    <select class="form-select" id="profile-vehicle-type" disabled>
                                        <option value="car">Car</option>
                                        <option value="auto">Auto Rickshaw</option>
                                        <option value="taxi">Taxi</option>
                                        <option value="bus">Bus</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="btn-group" id="profile-actions" style="margin-top: 8px;">
                                <button type="button" class="btn btn-primary" id="edit-btn"
                                    onclick="toggleEditMode(true)">
                                    Edit Profile
                                </button>
                                <div id="edit-actions" style="display: none; gap: 12px;">
                                    <button type="submit" class="btn"
                                        style="background-color: var(--color-available); color: white;" id="save-btn">
                                        Save
                                    </button>
                                    <button type="button" class="btn btn-danger" onclick="cancelEdit()">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="dashboard-card">
                        <h3>Quick Stats</h3>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                            <div class="stat-card">
                                <div class="stat-value" id="dash-total-bookings">0</div>
                                <div class="stat-label">Total Bookings</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="dash-active-bookings">0</div>
                                <div class="stat-label">Active</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="dash-favorites">0</div>
                                <div class="stat-label">Favorites</div>
                            </div>
                        </div>
                        <div style="margin-top: 24px;">
                            <a href="/" class="btn btn-primary" style="width: 100%;">Find Stations</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bookings Tab -->
            <div class="tab-panel" id="tab-bookings">
                <div id="dashboard-bookings-list">
                    <div class="loading-overlay">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Favorites Tab -->
            <div class="tab-panel" id="tab-favorites">
                <div id="favorites-list">
                    <div class="loading-overlay">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script src="{% static 'js/booking.js' %}"></script>
    <script>
        // Redirect if not logged in
        if (!API.isLoggedIn()) {
            window.location.href = '/login/';
        }

        // Prevent admin from using normal user dashboard
        const currentUser = API.getUser();
        if (currentUser && (currentUser.is_staff || currentUser.is_superuser)) {
            window.location.href = '/admin-dashboard/';
        }

        // Load profile
        async function loadProfile() {
            try {
                const user = await API.getProfile();
                API.setUser(user);
                document.getElementById('dashboard-username').textContent = user.username;
                document.getElementById('profile-username').value = user.username;
                document.getElementById('profile-email').value = user.email || '';
                document.getElementById('profile-firstname').value = user.first_name || '';
                document.getElementById('profile-lastname').value = user.last_name || '';
                document.getElementById('profile-phone').value = user.phone || '';
                document.getElementById('profile-vehicle').value = user.vehicle_number || '';
                document.getElementById('profile-vehicle-type').value = user.vehicle_type || 'car';
            } catch (e) {
                if (e.status === 401) {
                    API.clearTokens();
                    window.location.href = '/login/';
                }
            }
        }

        // Toggle Edit Mode
        function toggleEditMode(isEditing) {
            const form = document.getElementById('profile-form');
            const inputs = form.querySelectorAll('input:not(#profile-username), select');
            const editBtn = document.getElementById('edit-btn');
            const editActions = document.getElementById('edit-actions');

            inputs.forEach(input => input.disabled = !isEditing);

            if (isEditing) {
                editBtn.style.display = 'none';
                editActions.style.display = 'flex';
                inputs[0].focus();
            } else {
                editBtn.style.display = 'inline-flex';
                editActions.style.display = 'none';
            }
        }

        // Cancel Edit
        function cancelEdit() {
            const user = API.getUser();
            if (user) {
                document.getElementById('profile-email').value = user.email || '';
                document.getElementById('profile-firstname').value = user.first_name || '';
                document.getElementById('profile-lastname').value = user.last_name || '';
                document.getElementById('profile-phone').value = user.phone || '';
                document.getElementById('profile-vehicle').value = user.vehicle_number || '';
                document.getElementById('profile-vehicle-type').value = user.vehicle_type || 'car';
            }
            toggleEditMode(false);
        }

        // Update profile
        async function handleProfileUpdate(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            const originalContent = saveBtn.innerHTML;

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<div class="loading-spinner" style="display:inline-block;"></div> Saving...';

            try {
                const updatedData = {
                    email: document.getElementById('profile-email').value,
                    first_name: document.getElementById('profile-firstname').value,
                    last_name: document.getElementById('profile-lastname').value,
                    phone: document.getElementById('profile-phone').value,
                    vehicle_number: document.getElementById('profile-vehicle').value,
                    vehicle_type: document.getElementById('profile-vehicle-type').value,
                };

                const user = await API.updateProfile(updatedData);
                API.setUser(user); // Update local storage
                Utils.showToast('Profile updated!', 'success');
                toggleEditMode(false);
            } catch (error) {
                Utils.showToast('Failed to update profile', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalContent;
            }
        }

        // Load bookings
        async function loadDashboardBookings() {
            const container = document.getElementById('dashboard-bookings-list');
            try {
                const data = await API.getUserBookings();
                const bookings = data.results || data || [];

                document.getElementById('dash-total-bookings').textContent = bookings.length;
                document.getElementById('dash-active-bookings').textContent =
                    bookings.filter(b => b.status === 'confirmed' || b.status === 'pending').length;

                if (bookings.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <h3>No bookings yet</h3>
                            <p>Find a station and book your first slot!</p>
                            <a href="/" class="btn btn-primary" style="margin-top: 16px;">Find Stations</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = bookings.map(b => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <div class="booking-station">${b.station_name}</div>
                            <div class="booking-details">
                                 ${Utils.formatDate(b.date)} · ${b.slot_time} · ${b.vehicle_number || 'N/A'}
                            </div>
                        </div>
                        <div class="btn-group" style="align-items: center;">
                            <span class="booking-token">${b.token}</span>
                            <span class="booking-status ${b.status}">${b.status}</span>
                            ${b.status === 'confirmed' || b.status === 'pending' ? `
                                <button class="btn btn-danger btn-sm" onclick="cancelBooking('${b.booking_id}')">Cancel</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p style="text-align:center;color:var(--color-text-muted);">Failed to load bookings.</p>';
            }
        }

        async function cancelBooking(id) {
            if (!confirm('Cancel this booking?')) return;
            try {
                await API.cancelBooking(id);
                Utils.showToast('Booking cancelled', 'success');
                loadDashboardBookings();
            } catch (e) {
                Utils.showToast('Failed to cancel', 'error');
            }
        }

        // Load favorites
        async function loadFavorites() {
            const container = document.getElementById('favorites-list');
            try {
                const data = await API.getFavorites();
                const favs = data.results || data || [];

                document.getElementById('dash-favorites').textContent = favs.length;

                if (favs.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">⭐</div>
                            <h3>No favorites yet</h3>
                            <p>Tap the star icon on any station to save it here.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = favs.map(f => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <div class="booking-station">${f.station_name}</div>
                            <div class="booking-details">${f.station_address}</div>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-danger btn-sm" onclick="removeFavorite(${f.station}, this)">Remove</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p style="text-align:center;color:var(--color-text-muted);">Failed to load favorites.</p>';
            }
        }

        async function removeFavorite(stationId, btn) {
            try {
                await API.removeFavorite(stationId);
                Utils.showToast('Removed from favorites', 'success');
                loadFavorites();
            } catch (e) {
                Utils.showToast('Failed to remove', 'error');
            }
        }

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            if (tabName === 'bookings') loadDashboardBookings();
            if (tabName === 'favorites') loadFavorites();
        }

        // Init
        loadProfile();
        loadDashboardBookings();
        loadFavorites();
    </script>
</body>

</html>
