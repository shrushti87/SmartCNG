<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to SmartCNG to book slots, update crowd status, and manage your favorite CNG stations.">
    <title>Login – SmartCNG</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/theme-light.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/" class="nav-brand" style="justify-content: center; margin-bottom: 24px;">
                <!-- <div class="brand-icon">⛽</div> -->
                Smart<span style="color: var(--color-accent);">CNG</span>
            </a>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your account</p>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="login-username"
                           placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="login-password"
                           placeholder="Enter your password" required>
                </div>
                <div class="form-error" id="login-error" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;" id="login-btn">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register/">Create one</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script>
        // Redirect if already logged in
        if (API.isLoggedIn()) {
            window.location.href = '/';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner" style="display:inline-block;"></div> Signing in...';

            try {
                const result = await API.login(username, password);
                Utils.showToast('Login successful!', 'success');
                const user = result.user || API.getUser();
                if (user && (user.is_staff || user.is_superuser)) {
                    setTimeout(() => window.location.href = '/admin-dashboard/', 500);
                } else {
                    setTimeout(() => window.location.href = '/dashboard/', 500);
                }
            } catch (error) {
                const msg = error.data?.error || 'Invalid credentials. Please try again.';
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
