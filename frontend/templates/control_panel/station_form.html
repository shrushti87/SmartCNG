{% extends "control_panel/base_admin.html" %}

{% block content %}
<div style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-sm" style="margin-right: 15px;">← Back to Dashboard</a>
    <h2 style="margin: 0;">{{ title }}</h2>
</div>

<form method="POST" style="max-width: 600px; background: var(--color-bg-secondary); padding: 20px; border-radius: 8px;">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group" style="margin-bottom: 15px;">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
            <ul style="color: #dc3545; list-style: none; padding: 0; margin: 5px 0 0 0; font-size: 0.9em;">
                {% for error in field.errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
    {% endfor %}
    
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" class="btn btn-primary">Save Station</button>
        <a href="{% url 'admin_station_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
