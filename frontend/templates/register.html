<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your SmartCNG account to book CNG station slots and get real-time crowd updates.">
    <title>Register – SmartCNG</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/theme-light.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/" class="nav-brand" style="justify-content: center; margin-bottom: 24px;">
                <!-- <div class="brand-icon">⛽</div> -->
                Smart<span style="color: var(--color-accent);">CNG</span>
            </a>
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join SmartCNG and never wait in long queues again</p>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-input" id="reg-firstname" placeholder="John">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-input" id="reg-lastname" placeholder="Doe">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" class="form-input" id="reg-username"
                           placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-input" id="reg-email"
                           placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-input" id="reg-phone"
                           placeholder="+91 9876543210">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Vehicle Number *</label>
                        <input type="text" class="form-input" id="reg-vehicle"
                               placeholder="MH-02-AB-1234" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vehicle Type</label>
                        <select class="form-select" id="reg-vehicle-type">
                            <option value="car">Car</option>
                            <option value="auto">Auto Rickshaw</option>
                            <option value="taxi">Taxi</option>
                            <option value="bus">Bus</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" class="form-input" id="reg-password"
                           placeholder="At least 8 characters" required minlength="8">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" class="form-input" id="reg-password2"
                           placeholder="Re-enter your password" required>
                </div>
                <div class="form-error" id="register-error" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-lg" id="register-btn" style="width: 100%; margin-top: 8px;">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login/">Sign in</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script>
        if (API.isLoggedIn()) {
            window.location.href = '/';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const errorEl = document.getElementById('register-error');
            const btn = document.getElementById('register-btn');

            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;

            if (password !== password2) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner" style="display:inline-block;"></div> Creating account...';

            const data = {
                username: document.getElementById('reg-username').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                password: password,
                password2: password2,
                first_name: document.getElementById('reg-firstname').value.trim(),
                last_name: document.getElementById('reg-lastname').value.trim(),
                phone: document.getElementById('reg-phone').value.trim(),
                vehicle_number: document.getElementById('reg-vehicle').value.trim(),
                vehicle_type: document.getElementById('reg-vehicle-type').value,
            };

            try {
                await API.register(data);
                Utils.showToast('Account created successfully!', 'success');
                setTimeout(() => window.location.href = '/', 500);
            } catch (error) {
                let msg = 'Registration failed. Please check your details.';
                if (error.data) {
                    const errors = [];
                    for (const [key, value] of Object.entries(error.data)) {
                        const vals = Array.isArray(value) ? value : [value];
                        errors.push(...vals);
                    }
                    if (errors.length) msg = errors.join(' • ');
                }
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>
